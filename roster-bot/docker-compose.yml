services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roster}
      POSTGRES_DB: ${POSTGRES_DB:-roster}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Localhost-only port mapping for host-side scripts (data migration,
    # ad-hoc psql). Not reachable off-host.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roster} -d ${POSTGRES_DB:-roster}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  roster-bot:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-roster}:${POSTGRES_PASSWORD:-roster}@postgres:5432/${POSTGRES_DB:-roster}
    # Google Sheets service account key.
    # env_file passes GOOGLE_SERVICE_ACCOUNT_JSON through, but if you set it to a
    # *path* that path must exist inside the container, not on the host. Uncomment
    # this to mount the key read-only, then set:
    #   GOOGLE_SERVICE_ACCOUNT_JSON=/run/secrets/service-account.json
    # Not needed if you paste the raw JSON into the variable instead.
    # volumes:
    #   - ./service-account.json:/run/secrets/service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
